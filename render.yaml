services:
  - type: web
    name: diabetic-retinopathy-prediction
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn retinopathy_prediction.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: diabetic-retinopathy-db
          property: connectionString

databases:
  - name: diabetic-retinopathy-db
    databaseName: diabetic_retinopathy
    user: diabetic_retinopathy 